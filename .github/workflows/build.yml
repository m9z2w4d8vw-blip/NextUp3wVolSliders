# Builds NextUp 3 debs on a Linux runner — no Mac needed. Every successful run
# attaches its debs to a GitHub Release as well as to the run's Artifacts.
#
# Two variants, matching the two bootstraps:
#   rootless — vanilla Theos, scheme `rootless`, deb tagged iphoneos-arm64
#              (this is the one for Dopamine)
#   roothide — the roothide Theos FORK, scheme `roothide`, deb tagged
#              iphoneos-arm64e. The `roothide` scheme only exists in the fork.
#
# Each variant produces two debs. Theos already distinguishes them by version —
# `1.0.1-1+debug` vs `1.0.1` — so no renaming is needed. The +debug one has
# NULog compiled in, which is what makes NUVolumeProbeOnce's gate dump appear.
name: Build deb

# Needed by the release job to create tags and releases with the built-in token.
permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.scheme }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            flags: ROOTLESS=1
            # Upstream Theos's Logos truncates whatever follows a %orig
            # substitution on the same line; the hooks are written so nothing
            # ever does. If a future Logos change breaks the build again anyway,
            # swap in the roothide fork below — its Logos does not have that
            # behaviour, and `rootless` is a standard scheme it still ships.
            theos: https://github.com/theos/theos
            # theos: https://github.com/roothide/theos
          - scheme: roothide
            flags: ""
            theos: https://github.com/roothide/theos

    steps:
      - uses: actions/checkout@v4

      # Clones Theos, pulls the Linux toolchain and the theos/sdks tree, exports
      # $THEOS. The SDK it lands is also what the prefs subproject links the
      # private Preferences framework against — if that step complains, pin one
      # with NUPREFS_PRIVATE_SDK=iPhoneOS16.5.sdk on the make lines below.
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: ${{ matrix.theos }}

      # EVERY make invocation needs the variant flag, `clean` included. With no
      # flag the Makefile falls through to its default branch and sets
      # THEOS_PACKAGE_SCHEME := roothide, which vanilla Theos rejects outright
      # ("'roothide' package scheme does not exist") — and it rejects it while
      # parsing common.mk, i.e. before doing any cleaning, so a bare `make clean`
      # kills the rootless job on line one.
      - name: Build (DEBUG — includes the volume probe)
        run: |
          set -euxo pipefail
          mkdir -p out
          LOG=build-debug.log
          make clean ${{ matrix.flags }}
          make package ${{ matrix.flags }} DEBUG=1 2>&1 | tee "$LOG"
          # The arm64e class_ro signing is what killed every media app on the first
          # working build: libobjc dereferenced the signed pointer raw and the process
          # died in readClass() before a line of tweak code ran. The Makefile now fails
          # loudly rather than omitting the flag, but assert on the output too — a deb
          # built without it is worse than no deb.
          grep -q "class_ro signing -> disabled" "$LOG" || {
            echo "::error::arm64e class_ro signing was NOT disabled; refusing to ship this deb"
            exit 1
          }
          mv packages/*.deb out/

      - name: Build (release)
        run: |
          set -euxo pipefail
          LOG=build-release.log
          make clean ${{ matrix.flags }}
          make package ${{ matrix.flags }} FINALPACKAGE=1 2>&1 | tee "$LOG"
          # The arm64e class_ro signing is what killed every media app on the first
          # working build: libobjc dereferenced the signed pointer raw and the process
          # died in readClass() before a line of tweak code ran. The Makefile now fails
          # loudly rather than omitting the flag, but assert on the output too — a deb
          # built without it is worse than no deb.
          grep -q "class_ro signing -> disabled" "$LOG" || {
            echo "::error::arm64e class_ro signing was NOT disabled; refusing to ship this deb"
            exit 1
          }
          mv packages/*.deb out/

      - name: List what we built
        run: ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: nextup3-${{ matrix.scheme }}
          path: out/*.deb
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    # Runs even if one variant failed, so a broken roothide build still ships the
    # rootless deb (and vice versa).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # merge-multiple flattens both jobs' artifacts into one directory. The deb
      # names differ by architecture, so nothing collides.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: debs
          merge-multiple: true

      - name: Collect metadata
        id: meta
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(debs/*.deb)
          echo "count=${#found[@]}" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -m1 '^Version:' control | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          ls -lh debs/ 2>/dev/null || echo "no debs to publish"

      # gh is preinstalled on the runner, so this needs no third-party action.
      # Re-running an existing run reuses its run_number, hence the upload path:
      # the release already exists and its assets are replaced rather than the
      # whole step failing on a duplicate tag.
      - name: Publish to Releases
        if: ${{ steps.meta.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.version }}-build.${{ github.run_number }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Automated build.

          | deb | install on |
          | --- | --- |
          | `…_iphoneos-arm64.deb` | **rootless** bootstrap (Dopamine) |
          | `…_iphoneos-arm64e.deb` | **roothide** bootstrap |

          The `1.0.1-1+debug` builds have `NULog` compiled in — that is what makes
          the `volume probe:` gate dump appear in the log. Use those while the
          Lock Screen volume row is still unverified; the plain `1.0.1` builds are
          FINALPACKAGE and log nothing.
          EOF
          printf '\nCommit: %s\n' "$GITHUB_SHA" >> notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" debs/*.deb --clobber
          else
            gh release create "$TAG" debs/*.deb \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              --latest
          fi
