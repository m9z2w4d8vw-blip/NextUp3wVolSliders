# Builds all three jailbreak variants and publishes them as one Release, the way upstream
# does: three cleanly-labelled debs, one per jailbreak type.
#
# Everything runs on a macOS runner, because Apple's clang is the only one that accepts
# -fno-ptrauth-objc-class-ro. The Theos Linux toolchain does not have that flag at all, and an
# arm64e slice built without it emits signed class_ro pointers that kill every process the
# tweak is injected into, inside libobjc's readClass(), before a line of tweak code runs. See
# "Building for arm64e off a Mac" in the README. The Makefile refuses to build such a slice and
# the guard below refuses to publish one, but the real fix is simply to use the right compiler.
#
# The roothide variant needs the roothide FORK of Theos — the `roothide` package scheme only
# exists there — so it gets its own job with its own checkout.
#
# Two Makefile quirks the steps below have to respect:
#   * variant flags must be passed to `make clean` as well as `make package`. The whole file is
#     parsed on every invocation, so a bare `make clean` falls through to the default branch,
#     asks for the `roothide` scheme, and vanilla Theos rejects it before cleaning anything.
#   * ARCHS is assigned with `export ARCHS := …`, so only a command-line variable can override
#     it. Nothing here needs to — every variant already wants `arm64 arm64e`.
name: Build deb

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: rootful
            flags: ROOTFUL=1
            theos: https://github.com/theos/theos
          - variant: rootless
            flags: ROOTLESS=1
            theos: https://github.com/theos/theos
          - variant: roothide
            flags: ""
            theos: https://github.com/roothide/theos

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-src: ${{ matrix.theos }}

      # Release build first: it is the one that ships, so a failure here should be the
      # failure that stops the job.
      - name: Build (release)
        run: |
          set -euxo pipefail
          mkdir -p out
          make clean ${{ matrix.flags }}
          make package ${{ matrix.flags }} FINALPACKAGE=1 2>&1 | tee build-release.log
          grep -q "NextUp3: ptrauth-safe" build-release.log || {
            echo "::error::class_ro ptrauth was not made safe; refusing to ship this deb"
            exit 1
          }
          mv packages/*.deb out/

      # Debug build: NULog compiled in, which is what makes the volume diagnostics and the
      # Settings log export work. Kept out of the Release to leave it clean — it rides along
      # as a workflow artifact instead.
      - name: Build (DEBUG)
        run: |
          set -euxo pipefail
          make clean ${{ matrix.flags }}
          make package ${{ matrix.flags }} DEBUG=1 2>&1 | tee build-debug.log
          grep -q "NextUp3: ptrauth-safe" build-debug.log || {
            echo "::error::class_ro ptrauth was not made safe; refusing to ship this deb"
            exit 1
          }
          mv packages/*.deb out/

      - name: List what we built
        run: ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: nextup3-${{ matrix.variant }}
          path: out/*.deb
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    # Runs even if one variant failed, so a broken rootful build still ships the other two.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: debs
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          VERSION="$(grep -m1 '^Version:' control | cut -d' ' -f2)"
          TAG="v${VERSION}-build.${GITHUB_RUN_NUMBER}"

          # Theos already distinguishes the variants by the deb's architecture tag, which is
          # exactly how upstream's release does it — no renaming needed, just a readable label
          # per asset. GitHub shows the label in place of the filename (file#label).
          declare -A VARIANT=(
            [iphoneos-arm]=rootful
            [iphoneos-arm64]=rootless
            [iphoneos-arm64e]=roothide
          )

          ASSETS=()
          # rootful, rootless, roothide — in that order, so the release lists them that way.
          for arch in iphoneos-arm iphoneos-arm64 iphoneos-arm64e; do
            for f in debs/*_"${arch}".deb; do
              case "$f" in *+debug*) continue;; esac      # debug builds stay in the artifacts
              ASSETS+=("${f}#com.yves.nextup3_${VERSION} (${VARIANT[$arch]})")
            done
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::warning::no release debs to publish"
            exit 0
          fi
          printf 'publishing: %s\n' "${ASSETS[@]}"

          cat > notes.md <<EOF
          See and skip the upcoming track — and set the volume — right from the Lock Screen,
          Control Center and Dynamic Island. Works with Apple Music, Apple Podcasts, YouTube
          Music and Spotify on iOS 14.2 – 26.

          This fork adds a **volume slider to the Lock Screen player** (iOS 16 – 17). Turn it on
          in Settings › NextUp 3 › Volume.

          **Install:** download the \`.deb\` for your jailbreak below and install it with
          Sileo / Filza / \`dpkg -i\`, then respring.

          <sub>Built from \`${GITHUB_SHA:0:7}\`. Debug builds, with logging for the Settings log
          export, are attached to [the Actions run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).</sub>
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "NextUp 3 v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
              --notes-file notes.md \
              --latest
          fi
