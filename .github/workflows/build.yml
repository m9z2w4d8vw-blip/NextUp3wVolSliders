# Builds NextUp 3 rootless debs. Two runners on purpose, because the arm64e slice is
# the whole problem:
#
#   xcode-arm64e (macOS)  — Apple's clang, so -fno-ptrauth-objc-class-ro exists and the
#                           arm64e slice is built without signed class_ro pointers. This
#                           is the deb to install. It is also how upstream builds.
#   linux-arm64 (Ubuntu)  — the Theos Linux toolchain has no such flag, so an arm64e
#                           slice from it kills every process it is injected into
#                           (libobjc readClass, SIGBUS — verified on iOS 17.0). ARCHS is
#                           forced to arm64 alone here, which is safe: worst case an
#                           arm64-only dylib is not loaded into arm64e processes and the
#                           tweak simply does nothing. Fallback only.
#
# ARCHS has to be passed on the MAKE COMMAND LINE, not the environment: the Makefile
# assigns it with `export ARCHS := …`, and a command-line variable is the only kind that
# overrides a makefile assignment. It also has to go on `make clean` — the ptrauth block
# is parsed on every invocation and would $(error) out of a bare clean.
name: Build deb

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: xcode-arm64e
            os: macos-latest
            archs: arm64 arm64e
            suffix: xcode
          - label: linux-arm64
            os: ubuntu-latest
            archs: arm64
            suffix: linux-arm64only

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1

      # Which clang, and does it take the flag. Purely informational, never fatal — the
      # Makefile enforces the outcome. Worth having in the log because "the flag does not
      # exist" and "the triple is wrong" produce the same silent empty probe result, and
      # only one of them is a toolchain limitation.
      - name: Probe the ptrauth flag
        continue-on-error: true
        run: |
          set +e
          CLANG="$THEOS/toolchain/linux/iphone/bin/clang"
          [ -x "$CLANG" ] || CLANG="$(xcrun -f clang 2>/dev/null || command -v clang)"
          echo "clang: $CLANG"
          echo "--- flag, no triple ---"
          "$CLANG" -x objective-c -fsyntax-only -fno-ptrauth-objc-class-ro /dev/null; echo "rc=$?"
          echo "--- flag + arm64e triple ---"
          "$CLANG" -target arm64e-apple-ios15.0 -x objective-c -fsyntax-only \
            -fno-ptrauth-objc-class-ro /dev/null; echo "rc=$?"
          echo "--- arm64e triple alone ---"
          "$CLANG" -target arm64e-apple-ios15.0 -x objective-c -fsyntax-only /dev/null; echo "rc=$?"

      - name: Build (DEBUG — includes the volume probe)
        run: |
          set -euxo pipefail
          mkdir -p out
          make clean ROOTLESS=1 ARCHS="${{ matrix.archs }}"
          make package ROOTLESS=1 ARCHS="${{ matrix.archs }}" DEBUG=1 2>&1 | tee build-debug.log
          grep -q "NextUp3: ptrauth-safe" build-debug.log || {
            echo "::error::class_ro ptrauth was not made safe; refusing to ship this deb"
            exit 1
          }
          for f in packages/*.deb; do
            mv "$f" "out/$(basename "${f%.deb}")-${{ matrix.suffix }}.deb"
          done

      - name: Build (release)
        run: |
          set -euxo pipefail
          make clean ROOTLESS=1 ARCHS="${{ matrix.archs }}"
          make package ROOTLESS=1 ARCHS="${{ matrix.archs }}" FINALPACKAGE=1 2>&1 | tee build-release.log
          grep -q "NextUp3: ptrauth-safe" build-release.log || {
            echo "::error::class_ro ptrauth was not made safe; refusing to ship this deb"
            exit 1
          }
          for f in packages/*.deb; do
            mv "$f" "out/$(basename "${f%.deb}")-${{ matrix.suffix }}.deb"
          done

      - name: List what we built
        run: ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: nextup3-${{ matrix.label }}
          path: out/*.deb
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: debs
          merge-multiple: true

      - name: Collect metadata
        id: meta
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=(debs/*.deb)
          echo "count=${#found[@]}" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -m1 '^Version:' control | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          ls -lh debs/ 2>/dev/null || echo "no debs to publish"

      - name: Publish to Releases
        if: ${{ steps.meta.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.version }}-build.${{ github.run_number }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Automated build. Both debs are rootless (Dopamine); install ONE.

          | deb | built with | use |
          | --- | --- | --- |
          | `...-xcode.deb` | macOS, Apple clang, arm64 + arm64e | **this one** |
          | `...-linux-arm64only.deb` | Ubuntu, Theos Linux toolchain, arm64 only | fallback |

          The Linux toolchain has no `-fno-ptrauth-objc-class-ro`, so an arm64e slice
          from it emits signed `class_ro` pointers and every injected process dies in
          libobjc's `readClass()` before any tweak code runs. That build is therefore
          arm64-only; the macOS build is the correct full-fat one.

          `1.0.1-1+debug` has `NULog` compiled in, which is what makes the
          `volume probe:` / `volume layout:` lines and the Settings log export work.
          EOF
          printf '\nCommit: %s\n' "$GITHUB_SHA" >> notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" debs/*.deb --clobber
          else
            gh release create "$TAG" debs/*.deb \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file notes.md \
              --latest
          fi
